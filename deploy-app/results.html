<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptFit AI | Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Satoshi:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div class="page-shell page-shell--wide">
    <header class="top-nav">
      <div class="brand"><span class="brand-dot"></span>AdaptFit AI</div>
      <nav class="nav-links">
        <a class="nav-link" href="./onboarding-basic.html">Onboarding</a>
        <a class="nav-link" href="./workouts.html">Workouts</a>
        <a class="nav-link is-active" href="./results.html">Results</a>
        <button id="sign-out-btn" class="nav-button" type="button">Sign Out</button>
      </nav>
    </header>

    <div id="results-main" class="hidden">
      <section id="segments-section" class="content-panel results-segments-wrap hidden">
        <div id="segments-layout" class="results-playback-grid">
          <div id="video-column" class="results-video-column hidden">
            <div id="yt-player-mount" class="yt-player-mount"></div>
            <p id="playback-caption" class="playback-caption"></p>
          </div>
          <div class="results-segment-column">
            <div class="results-segment-header">Workout Flow</div>
            <p id="sync-hint" class="sync-hint hidden"></p>
            <div id="segment-scroll" class="results-segment-scroll" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <section class="panel-grid results-top-grid">
        <div class="split-panel">
          <div class="eyebrow">Saved output</div>
          <h2 class="section-title" style="font-size:2.4rem;margin-top:18px;">Review substitutions and timestamped risks</h2>
          <p id="result-metadata" style="margin-top:14px;">Load one of your saved analyses to see the latest risk flags and safer alternatives.</p>
          <div class="button-row" style="margin-top:24px;">
            <button id="new-analysis-btn" class="button" type="button">Analyze Another Workout</button>
            <button id="copy-markdown-btn" class="button secondary" type="button">Copy Markdown</button>
          </div>
        </div>
      </section>
    </div>

    <div id="empty-state" class="empty-state hidden">
      No saved analysis was found yet. Run an analysis from the workouts page first.
    </div>
  </div>

  <script type="module" src="./assets/js/results.js"></script>
</body>
</html>
